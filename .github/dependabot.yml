# Dependabot propose, chaque semaine, une demande de fusion quand une action
# de l'intégration continue a une version plus récente. Rien n'est fusionné
# tout seul.
#
# Les paquets Composer ne sont pas suivis ici : tant que wazi/framework n'est
# pas publié, Dependabot ne peut pas le télécharger.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
