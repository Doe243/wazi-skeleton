name: CI

# Sur chaque demande de fusion, et sur main après la fusion (ADR-034).
on:
  push:
    branches: [main]
  pull_request:

# Ce que vérifie cette CI : le projet de départ s'installe, sa console
# démarre, et ses pages répondent. C'est le parcours d'une personne qui
# vient de l'installer.
#
# Tant que wazi/framework n'est pas publié sur Packagist, Composer ne peut pas
# le télécharger : on récupère son dépôt à côté, et on le donne à Composer
# comme un dossier.
#
# Le jour où le framework est publié : retirer les étapes marquées
# « provisoire », il ne reste qu'un « composer install ».

env:
  # La version sous laquelle le dossier du framework est présenté à Composer.
  # Elle doit satisfaire la contrainte de composer.json (« ^0.4 »).
  FRAMEWORK_VERSION: '0.4.99'

# Cette CI ne fait que lire le dépôt : elle n'a le droit de rien écrire.
permissions:
  contents: read

# Un nouvel envoi sur la même branche arrête la vérification précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          path: skeleton

      - name: Récupérer le framework (provisoire)
        uses: actions/checkout@v7
        with:
          repository: wazi-php/wazi
          path: framework

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer

      - name: Vérifier composer.json
        working-directory: skeleton
        run: composer validate --strict

      - name: Donner le dossier du framework à Composer (provisoire)
        working-directory: skeleton
        run: |
          composer config repositories.wazi "{\"type\": \"path\", \"url\": \"../framework\", \"options\": {\"symlink\": false, \"versions\": {\"wazi/framework\": \"$FRAMEWORK_VERSION\"}}}"

      - name: Installer les dépendances
        working-directory: skeleton
        run: composer install --no-interaction --no-progress

      - name: Audit de sécurité des dépendances
        working-directory: skeleton
        run: composer audit

      - name: Syntaxe de chaque fichier PHP
        working-directory: skeleton
        run: |
          for fichier in app.php wazi public/index.php src/*.php; do
            php -l "$fichier"
          done

      - name: Réglages, comme après « composer create-project »
        working-directory: skeleton
        run: cp .env.example .env

      - name: La base se construit, comme après « composer create-project »
        working-directory: skeleton
        run: |
          php wazi db:migrate
          php wazi db:status
          test -f var/app.sqlite

      - name: La console démarre
        working-directory: skeleton
        run: |
          php wazi
          php wazi routes
          php wazi explain contact --method=POST
          php wazi messages

      - name: Les templates se préparent
        working-directory: skeleton
        run: php wazi views:compile

      - name: Les pages répondent
        working-directory: skeleton
        run: |
          php -S 127.0.0.1:8000 -t public > serveur.log 2>&1 &
          SERVEUR=$!
          sleep 2

          echecs=0

          # attendre <code attendu> <adresse> [options de curl...]
          attendre() {
            attendu=$1
            adresse=$2
            shift 2
            recu=$(curl -s -o /dev/null -w '%{http_code}' "$@" "http://127.0.0.1:8000$adresse")

            if [ "$recu" = "$attendu" ]; then
              echo "ok      $attendu  $adresse $*"
            else
              echo "ÉCHEC   $adresse $* : $recu reçu, $attendu attendu"
              echecs=$((echecs + 1))
            fi
          }

          attendre 200 /
          attendre 200 /a-propos
          attendre 200 /contact
          attendre 200 /app.css
          attendre 404 /nulle-part
          # Les réglages ne sont jamais servis.
          attendre 404 /.env
          # La base n'est jamais servie.
          attendre 404 /var/app.sqlite
          # Un formulaire sans jeton de protection est refusé.
          attendre 403 /contact -d 'nom=Alice&texte=Bonjour'

          # Un formulaire complet : le message arrive dans la base.
          jeton=$(curl -s -c cookies.txt http://127.0.0.1:8000/contact | grep -o 'name="_csrf" value="[a-f0-9]*"' | grep -o '[a-f0-9]\{64\}')
          attendre 303 /contact -b cookies.txt --data-urlencode 'nom=Alice' --data-urlencode "texte=Bonjour d'Alice; DROP TABLE messages" -d "_csrf=$jeton"
          attendre 422 /contact -b cookies.txt -d "nom=&texte=&_csrf=$jeton"

          if php wazi messages | grep -q "DROP TABLE messages"; then
            echo "ok      le message est dans la base, tel qu'il a été écrit"
          else
            echo "ÉCHEC   le message n'est pas dans la base"
            echecs=$((echecs + 1))
          fi

          kill $SERVEUR

          if [ "$echecs" -gt 0 ]; then
            echo "--- Journal du serveur"
            cat serveur.log
            exit 1
          fi
