name: CI

on:
  push:
  pull_request:

# Ce que vérifie cette CI : le projet de départ s'installe, sa console
# démarre, et ses pages répondent. C'est le parcours d'une personne qui
# vient de l'installer.
#
# Tant que wazi/framework n'est pas publié sur Packagist, Composer ne peut pas
# le télécharger : on récupère son dépôt à côté, et on le donne à Composer
# comme un dossier. Ce dépôt est privé : il faut un jeton pour le lire, rangé
# dans le secret WAZI_FRAMEWORK_TOKEN (Settings > Secrets and variables > Actions).
#
# Le jour où le framework est publié : retirer les étapes marquées
# « provisoire », il ne reste qu'un « composer install ».

env:
  # La version sous laquelle le dossier du framework est présenté à Composer.
  # Elle doit satisfaire la contrainte de composer.json (« ^0.3 »).
  FRAMEWORK_VERSION: '0.3.99'

jobs:
  installation:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Vérifier que le jeton est là (provisoire)
        env:
          TOKEN: ${{ secrets.WAZI_FRAMEWORK_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Le secret WAZI_FRAMEWORK_TOKEN n'existe pas. Sans lui, le dépôt privé du framework ne peut pas être lu."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          path: skeleton

      - name: Récupérer le framework (provisoire)
        uses: actions/checkout@v5
        with:
          repository: Doe243/wazi
          token: ${{ secrets.WAZI_FRAMEWORK_TOKEN }}
          path: framework

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer

      - name: Vérifier composer.json
        working-directory: skeleton
        run: composer validate --strict

      - name: Donner le dossier du framework à Composer (provisoire)
        working-directory: skeleton
        run: |
          composer config repositories.wazi "{\"type\": \"path\", \"url\": \"../framework\", \"options\": {\"symlink\": false, \"versions\": {\"wazi/framework\": \"$FRAMEWORK_VERSION\"}}}"

      - name: Installer les dépendances
        working-directory: skeleton
        run: composer install --no-interaction --no-progress

      - name: Audit de sécurité des dépendances
        working-directory: skeleton
        run: composer audit

      - name: Syntaxe de chaque fichier PHP
        working-directory: skeleton
        run: |
          for fichier in app.php wazi public/index.php src/*.php; do
            php -l "$fichier"
          done

      - name: Réglages, comme après « composer create-project »
        working-directory: skeleton
        run: cp .env.example .env

      - name: La console démarre
        working-directory: skeleton
        run: |
          php wazi
          php wazi routes
          php wazi explain contact --method=POST
          php wazi messages

      - name: Les templates se préparent
        working-directory: skeleton
        run: php wazi views:compile

      - name: Les pages répondent
        working-directory: skeleton
        run: |
          php -S 127.0.0.1:8000 -t public > serveur.log 2>&1 &
          SERVEUR=$!
          sleep 2

          echecs=0

          # attendre <code attendu> <adresse> [options de curl...]
          attendre() {
            attendu=$1
            adresse=$2
            shift 2
            recu=$(curl -s -o /dev/null -w '%{http_code}' "$@" "http://127.0.0.1:8000$adresse")

            if [ "$recu" = "$attendu" ]; then
              echo "ok      $attendu  $adresse $*"
            else
              echo "ÉCHEC   $adresse $* : $recu reçu, $attendu attendu"
              echecs=$((echecs + 1))
            fi
          }

          attendre 200 /
          attendre 200 /a-propos
          attendre 200 /contact
          attendre 200 /app.css
          attendre 404 /nulle-part
          # Les réglages ne sont jamais servis.
          attendre 404 /.env
          # Un formulaire sans jeton de protection est refusé.
          attendre 403 /contact -d 'nom=Alice&texte=Bonjour'

          kill $SERVEUR

          if [ "$echecs" -gt 0 ]; then
            echo "--- Journal du serveur"
            cat serveur.log
            exit 1
          fi
